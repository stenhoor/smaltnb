name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci          # also builds dist/ (prepare)
      - run: npm run deps    # smaltdb, smaltql and smaltdf, pinned in packed.json until they are on npm
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run deps
      # Playwright in its own folder: an npm install in the project would remove what npm run deps installed, and
      # npm run deps would remove a Playwright installed with --no-save. test/e2e/app.mjs finds it through NODE_PATH.
      - run: npm install --prefix "$RUNNER_TEMP/pw" playwright && "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - run: npm run e2e
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules     # builds the notebook page and drives it in headless Chromium

  # The GitHub Action (action.yml) in this repository, on the shop example: a headless run with parameters and actions.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          notebook: examples/shop.nb.ts
          init: examples/shop.sql
          params: |
            minQty=2
          actions: 'true'
          report: run.json
      - run: node -e "const r = require('./run.json'); if (!r.ok || !r.actions || r.params[0].value !== '2') process.exit(1)"
